<ion-content [fullscreen]="true" class="login-content ion-padding">
  <div class="login-wrapper">

    <!-- Header Logo & Branding -->
    <div class="brand-section">
      <div class="logo-circle">
        <ion-icon name="restaurant-outline"></ion-icon>
      </div>
      <h1 class="brand-title">Nilubon Kitchen & Cafe</h1>
      <p class="brand-subtitle">นิลุบล คิทเช่น แอนด์ คาเฟ่</p>
      <div class="badge-tag">ระบบลงเวลาเข้างาน GPS</div>
    </div>

    <!-- Login Form Card -->
    <ion-card class="login-card">
      <ion-card-header>
        <ion-card-title>เข้าสู่ระบบพนักงาน</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="onLogin()">
          <ion-item lines="inset" class="custom-input-item">
            <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
            <ion-label position="floating">ชื่อผู้ใช้ (Username)</ion-label>
            <ion-input
              [(ngModel)]="username"
              name="username"
              type="text"
              required
              autocomplete="username"
              placeholder="เช่น staff1, admin"
            ></ion-input>
          </ion-item>

          <ion-item lines="inset" class="custom-input-item">
            <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
            <ion-label position="floating">รหัสผ่าน (Password)</ion-label>
            <ion-input
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              required
              autocomplete="current-password"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              color="medium"
              (click)="showPassword = !showPassword"
              tabindex="-1"
            >
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>

          <div class="submit-area">
            <ion-button
              expand="block"
              shape="round"
              size="large"
              type="submit"
              [disabled]="isLoading || !username || !password"
              class="login-btn"
            >
              <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
              <span *ngIf="!isLoading">เข้าสู่ระบบ</span>
            </ion-button>
          </div>
        </form>

        <!-- Quick Demo Login Selection (Convenient for Mobile Testing) -->
        <div class="demo-accounts-box">
          <p class="demo-title">⚡ เลือกบัญชีทดสอบด่วน (คลิกเพื่อเข้าสู่ระบบ):</p>
          <div class="demo-chips">
            <ion-chip color="primary" (click)="quickLogin('staff1', 'password123')">
              <ion-icon name="person-circle-outline"></ion-icon>
              <ion-label>พนักงาน (staff1)</ion-label>
            </ion-chip>
            <ion-chip color="success" (click)="quickLogin('chef1', 'password123')">
              <ion-icon name="restaurant-outline"></ion-icon>
              <ion-label>ครัว (chef1)</ion-label>
            </ion-chip>
            <ion-chip color="secondary" (click)="quickLogin('admin', 'password123')">
              <ion-icon name="shield-checkmark-outline"></ion-icon>
              <ion-label>ผู้จัดการ (admin)</ion-label>
            </ion-chip>
          </div>
        </div>

      </ion-card-content>
    </ion-card>

    <div class="footer-note">
      <small>พิกัดร้าน: 70 ซ.อุดมเกียรติ ห้วยขวาง กทม.</small>
    </div>

  </div>
</ion-content>
